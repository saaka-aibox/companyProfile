services:
  mysql:
    image: mysql:8
    container_name: manage_compro-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: manage_compro
      MYSQL_ROOT_PASSWORD: Kenarimalam123
    ports:
      - "3306:3306"
    volumes:
      - manage_compro_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  manage_compro_mysql_data: